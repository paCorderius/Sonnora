name: APK de Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.SONNORA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sonnora-release.jks"
            echo "SONNORA_KEYSTORE_PATH=$RUNNER_TEMP/sonnora-release.jks" >> "$GITHUB_ENV"
            echo "Firmando con la llave de Sonnora."
          else
            echo "::warning::No hay llave guardada en los secretos: el APK se firma con una llave temporal (ver android/README.md)."
          fi

      - name: Compilar APK
        env:
          SONNORA_KEYSTORE_PASSWORD: ${{ secrets.SONNORA_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk sonnora.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sonnora-apk
          path: sonnora.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Sonnora para Android (build ${{ github.run_number }})
          body: |
            Descarga `sonnora.apk` desde tu teléfono Android e instálalo.
            Si Android lo pide, permite instalar apps de este origen.
          files: sonnora.apk
          make_latest: true
